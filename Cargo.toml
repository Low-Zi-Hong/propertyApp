[package]
name = "propbotd"
version = "0.1.0"
edition = "2021"
description = "Headless, event-driven property listing automation daemon"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
# `macros` is required in addition to `migrate` for the `sqlx::migrate!` macro
# (the macro is gated on both features by sqlx itself).
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ulid = "1"
anyhow = "1"
thiserror = "2"
rand = "0.8"
# M3 media pipeline (Section 22.2 / 27.3): stage-1 filter + image watermark overlay.
image = "0.25"
# M4 publisher (Section 24.5): Chrome DevTools Protocol over WebSocket.
tokio-tungstenite = "0.24"
futures-util = "0.3"
