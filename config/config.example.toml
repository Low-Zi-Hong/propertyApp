# Property Listing Automation Daemon - config.toml (copy to config/config.toml)
# All volatile parameters live here and are hot-reloadable. No magic constants in code.

[storage]
data_dir = "data"
db_file  = "propbot.db"

[telegram]
bot_token = ""                # env fallback: PROPBOT_BOT_TOKEN
allowed_sender_ids = []       # empty = all; else command allowlist
admin_chat_id = 0
poll_timeout_secs = 30
media_group_window_secs = 5

[ai]
deepseek_api_key = ""         # env fallback: PROPBOT_DEEPSEEK_API_KEY
base_url = "https://api.deepseek.com"
vision_enabled = false        # room-classifier seam for diverse photo selection (no-op while false)

[ai.enrichment]
model = "deepseek-v4-flash"
timeout_secs = 60
max_tokens = 4096
temperature = 0.7
layout_variations = 4

[ai.supervisor]
model = "deepseek-v4-pro"

[ai.vision]
model = ""
timeout_secs = 60

[agent]
agent_name = "Canny Chong"
agent_phone = "016-5583820"

[media]
dhash_hamming_threshold = 8     # clustering similarity: photos within this Hamming distance share a room/angle
watermark_text = "Canny Chong\n016-5583820"
watermark_font = "assets/font.ttf"
perturb_crop_px = [1, 2]
perturb_brightness = 0.01
strip_exif = true
max_photos = 8                  # selected, watermarked photo set size cap

[watermark]
image_path = "assets/watermark.jpg"   # bottom-left overlay image
position = "bottom_left"              # only "bottom-left" is supported in this revision
width_ratio = 0.34                    # overlay width as a fraction of the photo width
margin_px = 16                        # gap from the photo edges in pixels
opacity = 0.95                        # overlay alpha multiplier 0.0-1.0

[rate_limit]
min_delay_min = 8
max_delay_min = 18
max_per_hour = 5
max_per_24h = 12
active_hours_start = "08:30"
active_hours_end = "23:00"
timezone = "Asia/Kuala_Lumpur"

[publisher]
enabled = true                  # false = MVP manual-publishing mode; no Chrome is launched
chrome_path = ""
user_data_dir = "data/chrome-profile"
cdp_port = 9222
headless = false                # true = --headless; false keeps the window visible
selectors_file = "config/selectors.json"
submit_timeout_secs = 60
max_crosspost_groups = 10       # cross-post FB group cap
dry_run = true                  # stop before Publish; screenshot + notify
sale_create_url = "https://www.facebook.com/marketplace/create/propertyforsale"
rent_create_url = "https://www.facebook.com/marketplace/create/propertyrentals"

[gc]
retention_days = 7
interval_hours = 24
dry_run = false

[supervisor]
telegram_admin_chat_id = 0
circuit_breaker_cooldown_min = 30
